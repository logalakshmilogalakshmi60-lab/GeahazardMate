<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoHazardMate AI</title>
<style>
  :root {
    --primary: #D35400;
    --primary-dark: #943C00;
    --accent: #F5B041;
    --bg-1: #FDEBD0;
    --bg-2: #F0B27A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .chat-app {
    width: 100%;
    max-width: 480px;
    height: 85vh;
    max-height: 720px;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: linear-gradient(120deg, var(--primary), var(--primary-dark));
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .chat-header .icon {
    font-size: 28px;
    width: 46px;
    height: 46px;
    background: rgba(255, 255, 255, 0.18);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-header .title h1 {
    margin: 0;
    font-size: 17px;
  }

  .chat-header .title p {
    margin: 2px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f7fb;
  }

  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.bot {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid #e7e7ee;
    border-top-left-radius: 4px;
    color: #2b2b2b;
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(120deg, var(--primary), var(--primary-dark));
    color: #fff;
    border-top-right-radius: 4px;
  }

  .msg.typing {
    align-self: flex-start;
    background: #ffffff;
    border: 1px solid #e7e7ee;
    color: #999;
    font-style: italic;
  }

  .chat-input {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: #fff;
    border-top: 1px solid #eee;
  }

  .chat-input input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 24px;
    border: 1px solid #ddd;
    outline: none;
    font-size: 14px;
  }

  .chat-input input:focus {
    border-color: var(--primary);
  }

  .chat-input button {
    background: linear-gradient(120deg, var(--primary), var(--primary-dark));
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .chat-input button:hover {
    transform: translateY(-1px);
  }

  .chat-input button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .chat-window::-webkit-scrollbar {
    width: 6px;
  }

  .chat-window::-webkit-scrollbar-thumb {
    background: var(--accent);
    border-radius: 3px;
  }
</style>
</head>
<body>

  <div class="chat-app">
    <div class="chat-header">
      <div class="icon">🌋</div>
      <div class="title">
        <h1>{{ bot_name }}</h1>
        <p>geohazards specialist</p>
      </div>
    </div>

    <div class="chat-window" id="chatWindow">
      <div class="msg bot">
        Hi! I'm {{ bot_name }}. Ask me anything about geohazards.
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question..." autocomplete="off" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

<script>
  const chatWindow = document.getElementById("chatWindow");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const msg = document.createElement("div");
    msg.className = "msg " + sender;
    msg.textContent = text;
    chatWindow.appendChild(msg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return msg;
  }

  function showTyping() {
    const typing = document.createElement("div");
    typing.className = "msg typing";
    typing.id = "typingIndicator";
    typing.textContent = "Typing...";
    chatWindow.appendChild(typing);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById("typingIndicator");
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.reply || "Sorry, something went wrong.", "bot");
    } catch (err) {
      removeTyping();
      addMessage("Network error. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
